- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Import VPC variable
      include_vars: vars/vpc_setup

    - name: Vprofile VPC
      ec2_vpc_net:
        name: "{{vpc_name}}"
        cidr_block: "{{vpcCidr}}"
        region: "{{region}}"
        dns_support: yes
        dns_hostnames: yes
        tenancy: default
        state: "{{state}}"
      register: vpcout

    - name: Public Subnet 1a
      ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{region}}"
        cidr: "{{PubSub1Cidr}}"
        az: "{{zone1}}" 
        map_public: true
        state: "{{state}}"
        resource_tags:
          Name: Vprofile_pubsub1
      register: pubsub1_out

    - debug:
        var: pubsub1_out

    - name: Public Subnet 1b
      ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{region}}"
        cidr: "{{PubSub2Cidr}}"
        az: "{{zone2}}" 
        map_public: true
        state: "{{state}}"
        resource_tags:
          Name: Vprofile_pubsub2
      register: pubsub2_out

    - name: Public Subnet 1c
      ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{region}}"
        cidr: "{{PubSub3Cidr}}"
        az: "{{zone3}}" 
        map_public: true
        state: "{{state}}"
        resource_tags:
          Name: Vprofile_pubsub3
      register: pubsub3_out
      
    - name: Private Subnet 1a
      ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{region}}"
        cidr: "{{PrivSub1Cidr}}"
        az: "{{zone1}}" 
        map_public: false
        state: "{{state}}"
        resource_tags:
          Name: Vprofile_privsub1
      register: privsub1_out

    - name: Private Subnet 1b
      ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{region}}"
        cidr: "{{PrivSub2Cidr}}"
        az: "{{zone2}}" 
        map_public: false
        state: "{{state}}"
        resource_tags:
          Name: Vprofile_privsub2
      register: privsub2_out

    - name: Private Subnet 1c
      ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{region}}"
        cidr: "{{PrivSub3Cidr}}"
        az: "{{zone3}}" 
        map_public: false
        state: "{{state}}"
        resource_tags:
          Name: Vprofile_privsub3
      register: privsub3_out

    - name: Internet Gateway
      ec2_vpc_igw:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{state}}"
        tags:
          Name: "Vprofile_IGT"
      register: igw
    #- name: Debug IGW Output 
    #  debug:
    #    var: igw

    - name: Set up public subnet route table
      ec2_vpc_route_table:
        vpc_id: "{{vpcout.vpc.id}}"
        region: "{{region}}"
        tags:
          Name: Public
        #subnets:
        #  - "{{ pubsub1_out.subnet.id }}"
        #  - "{{ pubsub2_out.subnet.id }}"
        #  - "{{ pubsub3_out.subnet_id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
      register: public_route_table