- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Import VPC variable
      include_vars: vars/vpc_setup

    - name: Create Vprofile VPC
      ec2_vpc_net:
        name: "{{vpc_name}}"
        cidr_block: "{{vpcCidr}}"
        region: "{{region}}"
        dns_support: yes
        dns_hostnames: yes
        tenancy: default
        state: "{{state}}"
      register: vpcout
    - debug:
        var: vpcout

    - name: Creating Internet Gateway
      ec2_vpc_igw:
        name: "Vprofile_IGT"
        vpc_id: "{{vpcout.vpc.id}}"
        state: present
      register: igw
      -debug:
        var: igw